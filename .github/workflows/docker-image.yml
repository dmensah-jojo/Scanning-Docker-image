name: Cortex Image Scans

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
  CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
  CORTEX_API_URL: https://api-justruntime.xdr.us.paloaltonetworks.com
  IMAGE_NAME: docerleo/pcc_sandbox_analysis:latest
  # IMAGE_NAME: nginx:latest

jobs:
  cortex-image-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Download Cortex CLI
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading Cortex CLI..."

          crtx_resp=$(curl -fsSL \
            "${CORTEX_API_URL}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64" \
            -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" \
            -H "Authorization: ${CORTEX_API_KEY}")

          crtx_url=$(echo "${crtx_resp}" | jq -r '.signed_url')

          if [[ -z "${crtx_url}" || "${crtx_url}" == "null" ]]; then
            echo "ERROR: Cortex CLI download URL was not returned."
            echo "${crtx_resp}" | jq .
            exit 1
          fi

          curl -fsSL -o cortexcli "${crtx_url}"

          chmod +x cortexcli

          echo "Cortex CLI version:"
          ./cortexcli --version

      - name: Pull Container Image
        run: |
          docker pull "${IMAGE_NAME}"

      - name: Run Cortex CLI Image Scan
        shell: bash
        run: |
          set -euo pipefail

          ./cortexcli \
            --api-base-url "${CORTEX_API_URL}" \
            --api-key "${CORTEX_API_KEY}" \
            --api-key-id "${CORTEX_API_KEY_ID}" \
            image scan \
            --name "dmensah-test" \
            --timeout 90 \
            "${IMAGE_NAME}"
